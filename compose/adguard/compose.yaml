    image: adguard/adguardhome:v1.0.0@sha256:f00a586f0d1caa74f149340bfb225014960310488ffa838406b89256900a96c2
    network_mode: host
    volumes:
      - /etc/adguard/work:/opt/adguardhome/work
      - /etc/adguard/conf:/opt/adguardhome/conf
    restart: always

services:
  komodo-mcp-server:
    image: ghcr.io/mp-tool/komodo-mcp-server:1.5.0@sha256:3030d0c3f5edaf2023c46856e3fc20961d3dec2d7ce5a1da0b67913397d22edd
    container_name: komodo-mcp-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "9015:8000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

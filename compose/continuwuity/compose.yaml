services:
  app:
    image: forgejo.ellis.link/continuwuation/continuwuity:v26.9.3@sha256:a177e08ab62e3d5bc60e4b8cea0a2ea9d18d4cb2bf8a6138cb0392a423c575a8
    restart: unless-stopped
    command: /sbin/conduwuit
    depends_on:
      - unbound
    ports:
      - "9006:8008"
    volumes:
      - data:/var/lib/continuwuity
      - /private/etc/continuwuity/resolv.conf:/etc/resolv.conf:ro
    env_file:
      - .env
    networks:
      - dns
    stdin_open: true
    tty: true

  unbound:
    image: klutchell/unbound:1.26.2@sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "53"
    volumes:
      - unbound_data:/var/unbound
    networks:
      dns:
        ipv4_address: 10.10.10.20

volumes:
  data:
  unbound_data:

networks:
  dns:
    ipam:
      config:
        - subnet: 10.10.10.0/24

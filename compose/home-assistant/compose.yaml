services:
  app:
    container_name: home_assistant-app
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /etc/homelab/home_assistant/config:/config
      - /run/dbus:/run/dbus:ro
    env_file:
      - .env
    restart: unless-stopped
    privileged: true
    network_mode: host

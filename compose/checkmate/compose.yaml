services:
  app:
    image: ghcr.io/bluewave-labs/checkmate:v4.1.0@sha256:f66a53fce561a526f939d994337843ac03211364daa3fd1de3a492c895c503d5
    container_name: checkmate-app
    pull_policy: always
    restart: always
    ports:
      - 127.0.0.1:9009:52345
    env_file: .env
    depends_on:
      - db

  db:
    image: mongo:9.0@sha256:b0c835c26e5997413e985000f1013c275377cd9607761c1784d486f6dd620b7f
    container_name: checkmate-db
    hostname: mongodb
    restart: always
    command: ["mongod", "--quiet", "--bind_ip_all"]
    volumes:
      - data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

volumes:
  data:
